<!DOCTYPE html>
<html>
<head>
    <title>FaceFusion Cloud</title>
    <style>
        #loader {
            border: 16px solid #f3f3f3;
            border-radius: 50%;
            border-top: 16px solid #3498db;
            width: 120px;
            height: 120px;
            -webkit-animation: spin 2s linear infinite; /* Safari */
            animation: spin 2s linear infinite;
            display: none;
        }

        /* Safari */
        @-webkit-keyframes spin {
            0% { -webkit-transform: rotate(0deg); }
            100% { -webkit-transform: rotate(360deg); }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <h1>FaceFusion Cloud</h1>
    <form id="upload-form">
        <label for="video">Video:</label>
        <input type="file" name="video" id="video" accept="video/*" required>
        <br>
        <label for="image">Image:</label>
        <input type="file" name="image" id="image" accept="image/*" required>
        <br>
        <button type="submit">Upload and Process</button>
    </form>
    <div id="loader"></div>
    <div id="status"></div>
    <div id="result-container" style="display: none;">
        <h2>Processed Video</h2>
        <video id="result-video" controls></video>
    </div>

    <script>
        const form = document.getElementById("upload-form");
        const loader = document.getElementById("loader");
        const status = document.getElementById("status");
        const resultContainer = document.getElementById("result-container");
        const resultVideo = document.getElementById("result-video");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            loader.style.display = "block";
            status.textContent = "";
            resultContainer.style.display = "none";

            const formData = new FormData(form);
            const response = await fetch("/api/upload", {
                method: "POST",
                body: formData,
            });

            loader.style.display = "none";
            const data = await response.json();

            if (response.ok) {
                status.textContent = data.message;
                // In a real application, you would poll a /api/status endpoint
                // to check the progress of the processing job.
                // Once the job is complete, you would get the processed video URL
                // and display it.
                // For this example, we'll just show a message.
                // To simulate a result, you could uncomment the following lines
                // and replace the URL with a real video URL.
                /*
                resultVideo.src = "URL_TO_YOUR_PROCESSED_VIDEO";
                resultContainer.style.display = "block";
                */
            } else {
                status.textContent = `Error: ${data.error}`;
            }
        });
    </script>
</body>
</html>
